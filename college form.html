
<html>
<head>
<style>
body {
    background-color: lightyellow;
    font-family: Arial;
    margin: 0;
}

#banner {
    background-color: blue;
    color: white;
    width: 100%;
    text-align: center;
    padding: 20px 0;
    animation: bannerFade 2s ease-in-out;
}

@keyframes bannerFade {
    from {
        opacity: 0;
        transform: translateY(-50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#details {
    display: flex;
    gap: 30px;
    margin: 30px;
}

#event-details {
    border: 3px solid black;
    background-color: lightblue;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: slideLeft 2s ease;
    transition: 0.5s;
}

#registration-events {
    border: 3px solid black;
    background-color: lightpink;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: slideRight 2s ease;
    transition: 0.5s;
}

@keyframes slideLeft {
    from {
        opacity: 0;
        transform: translateX(-100px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideRight {
    from {
        opacity: 0;
        transform: translateX(100px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

#event-details:hover,
#registration-events:hover {
    transform: translateY(-10px);
    box-shadow: 5px 5px 15px gray;
}

h1 {
    text-align: center;
}

h3 {
    color: darkblue;
    transition: 0.3s;
}

h3:hover {
    color: red;
    transform: translateX(10px);
}

button {
    padding: 10px 20px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin: 20px auto;

    animation: buttonMove 2s infinite;
    transition: 0.5s;
}

@keyframes buttonMove {
    0% {
        transform: scale(1);
        background-color: green;
    }

    50% {
        transform: scale(1.2);
        background-color: orange;
    }

    100% {
        transform: scale(1);
        background-color: green;
    }
}

button:hover {
    background-color: darkgreen;
    transform: scale(1.2);
    box-shadow: 0 0 15px green;
}

@media screen and (max-width: 600px) {
    #details {
        flex-direction: column;
    }

    #event-details,
    #registration-events {
        width: auto;
    }
}
</style>
</head>

<body>

<div id="banner">
    <h1>STC | Pollachi</h1>
    <h2>TARANG</h2>
    <p>It is inter college meet fest, doing on 09-10-2026</p>
</div>

<div id="details">
    <div id="event-details">
        <h1>Event Details</h1>
        <h3>Quiz</h3>
        <h3>Connection</h3>
        <h3>Dancing</h3>
    </div>

    <div id="registration-events">
        <h1>Registration Details</h1>
        <h3>Registration fee is 150.
        It can be ended on 08-10-2026</h3>
    </div>
</div>

<button>Submit</button>

</body>
</html>
